<title>Wallet</title>
<style>
  :root {
    /* ---- light (falls back here when no scheme / data-theme="light") ---- */
    --wbg: #E9E9EE;
    --label: #111114;
    --sec: #85858B;
    --blue: #007AFF;
    --sheet: #FFFFFF;
    --sheet-ground: #F2F2F7;
    --hnr: #7C7C82;
    --hnr-phone-fill: rgba(0,122,255,.27);
    --hdr-ctl: rgba(118,118,128,.14);
    --hdr-ico: #1A1A1D;
    --hdr-divider: rgba(60,60,67,.22);
    --grabber: #C9C9CE;
    --danger: #FF3B30;
    --dz-border: #C4C4CB;
    --shadow-rest: 0 2px 10px rgba(24,24,34,.10), 0 10px 24px rgba(24,24,34,.10);
    --shadow-lift: 0 6px 18px rgba(24,24,34,.14), 0 22px 48px rgba(24,24,34,.22);
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wbg: #000000;
      --label: #F4F4F6;
      --sec: #8E8E93;
      --blue: #0A84FF;
      --sheet: #1C1C1E;
      --sheet-ground: #2C2C2E;
      --hnr: #86868B;
      --hnr-phone-fill: rgba(10,132,255,.31);
      --hdr-ctl: rgba(118,118,128,.24);
      --hdr-ico: #FFFFFF;
      --hdr-divider: rgba(255,255,255,.16);
      --grabber: #48484D;
      --dz-border: #48484D;
      --shadow-rest: 0 2px 10px rgba(0,0,0,.55), 0 10px 26px rgba(0,0,0,.45);
      --shadow-lift: 0 8px 22px rgba(0,0,0,.6), 0 26px 60px rgba(0,0,0,.65);
    }
  }
  :root[data-theme="dark"] {
    --wbg: #000000;
    --label: #F4F4F6;
    --sec: #8E8E93;
    --blue: #0A84FF;
    --sheet: #1C1C1E;
    --sheet-ground: #2C2C2E;
    --hnr: #86868B;
    --hnr-phone-fill: rgba(10,132,255,.31);
    --hdr-ctl: rgba(118,118,128,.24);
    --hdr-ico: #FFFFFF;
    --hdr-divider: rgba(255,255,255,.16);
    --grabber: #48484D;
    --dz-border: #48484D;
    --shadow-rest: 0 2px 10px rgba(0,0,0,.55), 0 10px 26px rgba(0,0,0,.45);
    --shadow-lift: 0 8px 22px rgba(0,0,0,.6), 0 26px 60px rgba(0,0,0,.65);
  }

  html, body {
    position: fixed;
    inset: 0;
    overflow: hidden;
    overscroll-behavior: none;
    margin: 0;
  }
  body {
    background: var(--wbg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--label);
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: absolute;
    inset: 0;
    touch-action: none;
    overflow: hidden;
  }

  /* ---------- home header ---------- */
  header {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    z-index: 400;
    pointer-events: none;
    will-change: transform, opacity;
  }
  header h1 {
    margin: 0;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.6px;
  }
  .hdr-controls {
    display: flex;
    align-items: center;
    gap: 11px;
    pointer-events: auto;
  }
  .ctl {
    -webkit-appearance: none;
    appearance: none;
    border: none;
    background: var(--hdr-ctl);
    color: var(--hdr-ico);
    cursor: pointer;
    font-family: inherit;
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
  .ctl:active { filter: brightness(.86); }
  .ctl.round {
    width: 38px; height: 38px;
    border-radius: 50%;
  }
  #addBtn { font-size: 25px; font-weight: 400; line-height: 1; padding-bottom: 2px; }
  .hdr-group {
    display: flex;
    align-items: center;
    height: 38px;
    border-radius: 19px;
    background: var(--hdr-ctl);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    overflow: hidden;
  }
  .hdr-group .ctl {
    background: none;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    width: 47px; height: 38px;
  }
  .hdr-group .sep { width: 1px; height: 22px; background: var(--hdr-divider); }
  .ctl svg { display: block; }
  .ctl:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }

  /* ---------- presented-state controls (X / more) ---------- */
  .pres-ctl {
    position: absolute;
    top: calc(14px + env(safe-area-inset-top, 0px));
    z-index: 460;
    opacity: 0;
    pointer-events: none;
    will-change: opacity;
  }
  #closeBtn { left: 20px; }
  #optBtn   { right: 20px; }
  #optBtn { font-size: 21px; font-weight: 700; line-height: 1; padding-bottom: 8px; }

  /* ---------- wallet items ---------- */
  .item {
    position: absolute;
    left: 50%;
    top: 0;
    overflow: hidden;
    background: var(--card-white, #f5f6f6);
    box-shadow: var(--shadow-rest);
    will-change: transform;
    cursor: pointer;
  }
  .item.lifted { box-shadow: var(--shadow-lift); }
  .item img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    -webkit-user-drag: none;
  }
  .item:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  /* theme-matched cutout that sits at the top of the frontmost pass */
  .notch {
    position: absolute;
    top: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 18%;
    aspect-ratio: 3.4;
    background: var(--wbg);
    border-bottom-left-radius: 50% 100%;
    border-bottom-right-radius: 50% 100%;
    z-index: 2;
  }

  /* ---------- Hold Near Reader ---------- */
  #hnr {
    position: absolute;
    top: 0;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    z-index: 50;
    pointer-events: none;
    opacity: 0;
    will-change: opacity;
  }
  .hnr-ring {
    width: 63px; height: 63px;
    box-sizing: border-box;
    border-radius: 50%;
    border: 3.5px solid var(--blue);
    position: relative;
    overflow: hidden;
  }
  .hnr-phone {
    position: absolute;
    left: 50%; bottom: -4px;
    width: 32px; height: 50px;
    box-sizing: border-box;
    border: 2px solid var(--blue);
    border-radius: 8px;
    background: var(--hnr-phone-fill);
    transform: translate(-50%, var(--rise, 0px));
    will-change: transform;
  }
  .hnr-phone::before {
    content: "";
    position: absolute;
    top: 2px; left: 50%;
    transform: translateX(-50%);
    width: 9px; height: 3px;
    border-radius: 1.5px;
    background: var(--blue);
  }
  .hnr-label {
    font-size: 21px;
    font-weight: 400;
    letter-spacing: -.2px;
    color: var(--hnr);
  }

  /* ---------- sheets ---------- */
  #dim {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    z-index: 600;
    pointer-events: none;
  }
  .sheet {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    margin: 0 auto;
    max-width: 560px;
    background: var(--sheet);
    border-radius: 18px 18px 0 0;
    z-index: 620;
    transform: translate3d(0, 105%, 0);
    will-change: transform;
    padding: 8px 20px calc(22px + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
  }
  .grabber {
    width: 36px; height: 5px;
    border-radius: 3px;
    background: var(--grabber);
    margin: 4px auto 14px;
  }
  #sheet h2 {
    margin: 0 0 6px;
    font-size: 22px;
    font-weight: 700;
    text-align: center;
  }
  #sheet .hint {
    margin: 0 0 16px;
    font-size: 14px;
    line-height: 1.4;
    color: var(--sec);
    text-align: center;
  }
  #dropzone {
    height: 168px;
    border: 2px dashed var(--dz-border);
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    cursor: pointer;
    color: var(--sec);
    font-size: 15px;
    font-weight: 500;
    overflow: hidden;
    position: relative;
    background: var(--sheet-ground);
  }
  #dropzone.haspreview { border-style: solid; }
  #dropzone img {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    background: var(--sheet-ground);
  }
  .sheet-actions {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 18px;
  }
  .btn-primary {
    height: 50px;
    border: none;
    border-radius: 14px;
    background: var(--blue);
    color: #fff;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primary:disabled { opacity: .4; cursor: default; }
  .btn-plain {
    height: 44px;
    border: none;
    background: none;
    color: var(--blue);
    font-size: 17px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;

    border: none;
    border-radius: 14px;

          <svg width="19" height="19" viewBox="0 0 19 19" fill="none">
            <circle cx="8" cy="8" r="6.2" stroke="currentColor" stroke-width="2"/>

        <button id="moreHomeBtn" class="ctl" aria-label="More">

          </svg>

      <line x1="13" y1="2" x2="2" y2="13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>

    presented = it;
    it.el.classList.add("lifted");
    HR.snap(0);
    curD = Math.max(140, (it.homeY - scrollY) - presentedY);
    P.to(1, v || 0);
  }
  function dismiss(v) {
    if (!presented) return;
    P.to(0, v || 0);
    if (EY.x !== 0) EY.to(0);
  }

  /* ---------- gestures ---------- */
  var dragging = false;
  var gesture = null;
  var startX = 0, startY = 0, startT = 0, startScroll = 0, basePGrab = 1, movedFar = false;
  var samples = [];

  function trackV(y, t) {
    samples.push({ y: y, t: t });
    while (samples.length > 2 && t - samples[0].t > 90) samples.shift();
  }
  function sampleV() {
    if (samples.length < 2) return 0;
    var a = samples[0], b = samples[samples.length - 1];
    var dt = (b.t - a.t) / 1000;
    return dt > 0.004 ? (b.y - a.y) / dt : 0;
  }

  stage.addEventListener("pointerdown", function (e) {
    if (sheetOpen || removeOpen || removing) return;
    if (e.target.closest && e.target.closest("button")) return; // header / control buttons handle themselves
    dragging = true;
    movedFar = false;
    startX = e.clientX; startY = e.clientY; startT = e.timeStamp;
    samples = [];
    trackV(e.clientY, e.timeStamp);
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}

    if (presented || P.active) {
      basePGrab = clamp(P.x, 0, 1);
      P.active = false; P.v = 0;
      gesture = (e.clientY > VH - 175 && basePGrab > 0.9) ? "stack" : "pass";
      if (!presented) gesture = null;
    } else {
      gesture = "scroll";
      startScroll = scrollY;
      scrollV = 0;
      if (bouncing || SB.active) { scrollY = SB.x; startScroll = scrollY; SB.active = false; bouncing = false; }
    }
  });

  stage.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var dy = e.clientY - startY;
    trackV(e.clientY, e.timeStamp);
    if (Math.abs(dy) > 6 || Math.abs(e.clientX - startX) > 6) movedFar = true;

    if (gesture === "scroll") {
      var target = startScroll - dy;
      if (target < 0) target = -rubber(-target, VH);
      else if (target > maxScroll) target = maxScroll + rubber(target - maxScroll, VH);
      scrollY = target;
      render();
    } else if (gesture === "pass") {
      var want = basePGrab - dy / curD;
      if (want > 1) {
        P.x = 1;
        EY.snap(-rubber((want - 1) * curD, 260));
      } else {
        EY.snap(0);
        P.x = clamp(want, 0, 1);
      }
      render();
    } else if (gesture === "stack") {
      P.x = clamp(1 + dy / (VH * 0.55), 0, 1);
      render();
    }
  });

  function endDrag(e) {
    if (!dragging) return;
    dragging = false;
    var dt = e.timeStamp - startT;
    var vy = sampleV();

    if (gesture === "scroll") {
      if (!movedFar && dt < 450) {
        var it = itemAtPoint(e.clientX, e.clientY);
        if (it) { present(it); return; }
      }
      if (scrollY < 0 || scrollY > maxScroll) {
        var bound = scrollY < 0 ? 0 : maxScroll;
        SB.snap(scrollY); SB.v = -vy; SB.to(bound); bouncing = true;
      } else {
        scrollV = -vy;
        kick();
      }
    } else if (gesture === "pass") {
      if (EY.x !== 0) { EY.to(0, -vy * 0.6); P.to(1); return; }
      var vp = -vy / curD;
      if (P.x < 0.5 || vy > 650) dismiss(vp);
      else P.to(1, vp);
    } else if (gesture === "stack") {
      if (!movedFar && dt < 450) { dismiss(); return; }
      var vp2 = vy / (VH * 0.55);
      if (P.x < 0.75 || vy < -450) P.to(0, vp2);
      else P.to(1, vp2);
    }
    gesture = null;
  }
  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", function (e) {
    if (!dragging) return;
    dragging = false;
    if (gesture === "pass") P.to(P.x > 0.5 ? 1 : 0);
    if (gesture === "stack") P.to(1);
    if (EY.x !== 0) EY.to(0);
    gesture = null;
  });

  function itemAtPoint(x, y) {
    if (Math.abs(x - VW / 2) > CW / 2) return null;
    var live = items.filter(function (it) { return it !== removing; });
    for (var i = live.length - 1; i >= 0; i--) {
      var top = live[i].homeY - scrollY;
      if (y >= top && y <= top + live[i].h) return live[i];
    }
    return null;
  }

  document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });
  window.addEventListener("wheel", function (e) {
    if (!presented && !sheetOpen && !removeOpen) {
      scrollY = clamp(scrollY + e.deltaY, 0, maxScroll);
      scrollV = 0;
      kick();
    }
  }, { passive: true });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      if (removeOpen) closeRemove();
      else if (sheetOpen) closeSheet();
      else if (presented) dismiss();
    }
    if ((e.key === "Enter" || e.key === " ") && document.activeElement && document.activeElement.classList.contains("item")) {
      var it = items.filter(function (x) { return x.el === document.activeElement; })[0];
      if (it && !presented) { e.preventDefault(); present(it); }
    }
  });

  closeBtn.addEventListener("click", function () { if (presented) dismiss(); });
  optBtn.addEventListener("click", function () { if (presented) openRemove(); });

  /* ---------- add sheet ---------- */
  var addBtn = document.getElementById("addBtn");
  var dropzone = document.getElementById("dropzone");
  var dzLabel = document.getElementById("dzLabel");
  var fileInput = document.getElementById("fileInput");
  var confirmAdd = document.getElementById("confirmAdd");

  function openSheet() {
    sheetOpen = true;
    pendingImg = null;
    confirmAdd.disabled = true;
    dropzone.classList.remove("haspreview");
    dropzone.querySelectorAll("img").forEach(function (n) { n.remove(); });
    dzLabel.textContent = "Choose an image";
    PS.to(1);
  }
  function closeSheet() {
    sheetOpen = false;
    PS.to(0);
  }
  addBtn.addEventListener("click", openSheet);
  document.getElementById("cancelAdd").addEventListener("click", closeSheet);
  dim.addEventListener("pointerdown", function () {
    if (removeOpen) closeRemove();
    else if (sheetOpen) closeSheet();
  });

  dropzone.addEventListener("click", function () { fileInput.click(); });
  dropzone.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fileInput.click(); }
  });

  fileInput.addEventListener("change", function () {
    var f = fileInput.files && fileInput.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var maxW = 1000;
        var w = Math.min(img.naturalWidth, maxW);
        var h = Math.round(img.naturalHeight * (w / img.naturalWidth));
        var cv = document.createElement("canvas");
        cv.width = w; cv.height = h;
        var cx = cv.getContext("2d");
        cx.fillStyle = "#fff";
        cx.fillRect(0, 0, w, h);
        cx.drawImage(img, 0, 0, w, h);
        var src = cv.toDataURL("image/jpeg", 0.86);
        var ratio = clamp(h / w, 0.55, 1.7);
        pendingImg = { src: src, ratio: ratio };
        confirmAdd.disabled = false;
        dropzone.classList.add("haspreview");
        dropzone.querySelectorAll("img").forEach(function (n) { n.remove(); });
        var pv = document.createElement("img");
        pv.src = src;
        pv.alt = "Selected pass preview";
        dropzone.appendChild(pv);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(f);
    fileInput.value = "";
  });

  confirmAdd.addEventListener("click", function () {
    if (!pendingImg) return;
    var it = makePass("p" + Date.now(), pendingImg.src, pendingImg.ratio, true, "Saved pass", true);
    items.push(it);
    measure();
    saveUserPasses();
    closeSheet();
    scrollY = clamp(scrollY, 0, maxScroll);
    setTimeout(function () { present(it); }, RM ? 0 : 340);
  });

  /* ---------- remove flow ---------- */
  function openRemove() { removeOpen = true; RS.to(1); }
  function closeRemove() { removeOpen = false; RS.to(0); }
  document.getElementById("cancelRemove").addEventListener("click", closeRemove);
  document.getElementById("confirmRemove").addEventListener("click", function () {
    if (!presented) { closeRemove(); return; }
    removing = presented;
    closeRemove();
    computeHome();
    P.to(0);
  });

  /* ---------- toast ---------- */
  var toastT = null;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  /* ---------- boot ---------- */
  buildItems();
  measure();
  window.addEventListener("resize", function () {
    measure();
    scrollY = clamp(scrollY, 0, maxScroll);
    render();
  });
  render();
})();
</script>

</body>
</html>
